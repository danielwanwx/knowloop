name: Learning Coach QA

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coach-qa:
    name: Code, privacy and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit and regression tests
        run: python -m unittest discover -s tests -v
      - name: Privacy scan
        run: python scripts/check_public_content.py
      - name: Verify curriculum and installable copies
        run: |
          python scripts/sync_plugin_content.py
          python scripts/qa_curriculum.py --no-live
          if [ -n "$(git status --porcelain=v1)" ]; then
            git status --short
            exit 1
          fi

  upstream-sources:
    name: Upstream source maintenance
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Live-verify pinned sources and public plan
        run: python scripts/build_curriculum.py --workers 8
